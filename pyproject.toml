[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ristretto-ops"
version = "0.2.0"
description = "Configurable local-first operations assistant built on Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Silvia Arellano"}]
dependencies = ["PyYAML>=6.0,<7.0"]

[project.optional-dependencies]
# Read-only fleet view. Optional: the CLI and loop work without it.
dash = ["fastapi>=0.115", "jinja2>=3.1", "uvicorn>=0.30"]

[project.scripts]
ristretto = "ristretto.cli:main"
# The product is Nemo; the package rename is deferred, the name is not.
nemo = "ristretto.cli:main"
ristretto-run-flow = "ristretto.runner:main"

[tool.setuptools.packages.find]
include = ["ristretto*"]

[tool.setuptools.package-data]
"ristretto.dash" = ["templates/*.html"]

[tool.setuptools.data-files]
"share/ristretto" = ["ristretto.yaml"]
