[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ristretto-ops"
version = "0.2.0"
description = "Configurable local-first operations assistant built on Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Silvia Arellano"}]
dependencies = ["PyYAML>=6.0,<7.0"]

[project.optional-dependencies]
ops = ["mcp>=1.0"]

[project.scripts]
ristretto = "ristretto.cli:main"
ristretto-run-flow = "ristretto.runner:main"

[tool.setuptools.packages.find]
include = ["ristretto*"]

[tool.setuptools.data-files]
"share/ristretto" = ["ristretto.yaml"]
