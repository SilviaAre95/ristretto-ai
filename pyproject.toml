[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuzam-ops"
version = "0.2.0"
description = "Configurable local-first operations assistant built on Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Silvia Arellano"}]
# `mcp` is not optional: the approval gate is on by default, and a stage
# that cannot reach the broker fails at its first permission request.
# It was undeclared until 2026-09-26, which meant `install-runtime`
# produced a runtime that could never gate a mutating stage.
# Capped below 2.0 deliberately: mcp 2.2.0 removed `Server.list_tools`
# from the low-level server this uses. The imports still succeed there,
# so the broker starts and dies on the decorator — see `serveable`.
dependencies = ["PyYAML>=6.0,<7.0", "mcp>=1.0,<2.0"]

[project.optional-dependencies]
# Read-only fleet view. Optional: the CLI and loop work without it.
dash = ["fastapi>=0.115", "jinja2>=3.1", "uvicorn>=0.30"]

[project.scripts]
cuzam = "cuzam.cli:main"
# The system is Cuzam; the assistant is Zam. Both reach the same CLI.
zam = "cuzam.cli:main"
cuzam-run-flow = "cuzam.runner:main"
# Deprecated, kept for one release. A cron job, a shell alias or a script
# written before the rename calls `ristretto`, and a console script costs
# nothing next to that breaking silently in an unattended run. The migration
# removes the ~/.local/bin link; these are what keep PATH working until the
# next install. Remove after 0.3.0.
ristretto = "cuzam.cli:main"
nemo = "cuzam.cli:main"  # drop in 0.3.0

[tool.setuptools.packages.find]
include = ["cuzam*"]

[tool.setuptools.package-data]
"cuzam.dash" = ["templates/*.html"]

[tool.setuptools.data-files]
"share/cuzam" = ["cuzam.yaml"]
