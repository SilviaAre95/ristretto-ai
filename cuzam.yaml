schema_version: 1
default_flow: full
base_branch: main

# Public, non-secret defaults. A user installation copies this file to
# ~/.config/cuzam/config.yaml and customizes it there.
instance:
  name: Zam
  linear_team_env: CUZAM_LINEAR_TEAM
  slack_home_channel_env: SLACK_HOME_CHANNEL
  slack_prs_channel_env: CUZAM_SLACK_PRS_CHANNEL
  slack_alerts_channel_env: CUZAM_SLACK_ALERTS_CHANNEL
  knowledge_vault_env: CUZAM_KNOWLEDGE_VAULT

# Map the Linear project names used by your team to local repositories in your
# user-owned config. Example:
# repositories:
#   Example App: ~/code/example-app
repositories: {}

providers:
  # Coding runs on Claude. Opus reasons and reviews, Sonnet builds and repairs,
  # Haiku writes the PR. The reviewer is never the model that wrote the code.
  #
  # No fallback is configured on the coding providers. There was one, to
  # local-coder, and it is gone with the premise: a Claude outage silently
  # handing the build to a local model is the retired arrangement reappearing
  # unattended. The fallback machinery in runner.py stays, so an installation
  # that wants one can configure it deliberately.
  claude-opus:
    runner: claude-code
    model: opus
  claude:
    runner: claude-code
    model: sonnet
  claude-haiku:
    runner: claude-code
    model: haiku
  # The local brain: the MoE orchestrator served by Ollama on this machine,
  # fast, 256k context. It is the target of instance.assistant_provider and
  # does the bounded-transformation work — summarising, classifying, ranking.
  # It is deliberately not given a mutating stage in any shipped flow.
  local-brain:
    runner: claude-code
    model: qwen3.6:35b-mlx
    model_env: ZAM_LOCAL_BRAIN_MODEL
    base_url: http://localhost:11434
    # Non-secret compatibility placeholder required by Ollama's local API.
    # Real provider credentials must use auth_token_env, never auth_token.
    auth_token: ollama
    # Real window for this model; without it the runner assumes 200k.
    context_length: 262144
  # Independent reviewer for custom flows; not used by the shipped ones.
  codex:
    runner: codex

# Flows trade scrutiny for speed, not cloud spend for local compute. Every
# flow keeps the same spine: verify is always the deterministic builtin gate
# reading the repository's own .cc-verify, and the pr stage is always last.
#
# The tier0-tier3 ladder that lived here graded how much Claude a run used,
# with the token-heavy build on a local coder. That premise was retired on
# 2026-09-23 after every local build died in the build stage, which empties
# the axis: with all coding on Claude there is nothing left for a tier to
# measure. Model choice per stage is now ordinary cost-fitting inside Claude.
flows:
  classic:
    description: Existing Claude /loop-dev path.
    builtin: classic

  full:
    description: Plan, build, review, repair, verify, PR. Opus plans and reviews, Sonnet builds and repairs, Haiku opens the PR.
    stages:
      - id: plan
        role: plan
        provider: claude-opus
        mutates: false
        output: plan.md
      - id: build
        role: build
        provider: claude
        mutates: true
        inputs: [plan.md]
        output: build.md
      - id: review
        role: review
        provider: claude-opus
        mutates: false
        inputs: [plan.md, build.md]
        output: review.md
      - id: repair
        role: repair
        provider: claude
        mutates: true
        inputs: [plan.md, review.md]
        output: repair.md
      - id: verify
        role: verify
        provider: builtin
        mutates: false
        output: verify.txt
      - id: finish
        role: pr
        provider: claude-haiku
        mutates: true
        inputs: [plan.md, review.md, repair.md, verify.txt]
        output: finish.md

  short:
    description: Plan, build, verify, PR. For low-risk changes; the verify gate is the only review.
    stages:
      # Opus, not Sonnet. In the full flow a weak plan is caught at review;
      # here there is no review stage, so the plan is the only judgement in
      # the flow. It is also the cheapest stage to spend a stronger model on
      # — it reads little and runs once.
      - id: plan
        role: plan
        provider: claude-opus
        mutates: false
        output: plan.md
      - id: build
        role: build
        provider: claude
        mutates: true
        inputs: [plan.md]
        output: build.md
      - id: verify
        role: verify
        provider: builtin
        mutates: false
        output: verify.txt
      - id: finish
        role: pr
        provider: claude-haiku
        mutates: true
        inputs: [plan.md, verify.txt]
        output: finish.md
