schema_version: 1
default_flow: classic
base_branch: main

# Public, non-secret defaults. A user installation copies this file to
# ~/.config/ristretto/config.yaml and customizes it there.
instance:
  name: Ris
  linear_team_env: RISTRETTO_LINEAR_TEAM
  slack_home_channel_env: SLACK_HOME_CHANNEL
  slack_prs_channel_env: RISTRETTO_SLACK_PRS_CHANNEL
  slack_alerts_channel_env: RISTRETTO_SLACK_ALERTS_CHANNEL
  knowledge_vault_env: RISTRETTO_KNOWLEDGE_VAULT

# Map the Linear project names used by your team to local repositories in your
# user-owned config. Example:
# repositories:
#   Example App: ~/code/example-app
repositories: {}

providers:
  # Claude tiers. Opus reasons and reviews, Sonnet builds and repairs, Haiku
  # writes the PR. The reviewer is never the model that wrote the code.
  claude-opus:
    runner: claude-code
    model: opus
  claude:
    runner: claude-code
    model: sonnet
    fallback: local-coder
  claude-haiku:
    runner: claude-code
    model: haiku
  # Local models served by Ollama on this machine. The brain is the MoE
  # orchestrator (fast, 256k context); the coder is the dense 27B coding
  # build. Override either per machine or per run through the *_env names.
  local-brain:
    runner: claude-code
    model: qwen3.6:35b-mlx
    model_env: RIS_LOCAL_BRAIN_MODEL
    base_url: http://localhost:11434
    # Non-secret compatibility placeholder required by Ollama's local API.
    # Real provider credentials must use auth_token_env, never auth_token.
    auth_token: ollama
    # Real window for this model; without it the runner assumes 200k.
    context_length: 262144
  local-coder:
    runner: claude-code
    model: qwen3.6:27b-coding-nvfp4
    model_env: RIS_LOCAL_LOOP_MODEL
    base_url: http://localhost:11434
    auth_token: ollama
    # Real window for this model; without it the runner assumes 200k.
    context_length: 262144
  # Independent reviewer for custom flows; not used by the standard tiers.
  codex:
    runner: codex

# Tiers trade cloud spend for local compute. Every tier keeps the same shape:
# plan -> build -> review -> repair -> verify -> pr, verify is always the
# deterministic builtin gate, and the reviewer is never the builder.
flows:
  classic:
    description: Existing Claude /loop-dev with automatic local fallback.
    builtin: classic

  tier0:
    description: All Claude. Opus plans and reviews, Sonnet builds and repairs, Haiku opens the PR.
    stages:
      - id: plan
        role: plan
        provider: claude-opus
        mutates: false
        output: plan.md
      - id: build
        role: build
        provider: claude
        mutates: true
        inputs: [plan.md]
        output: build.md
      - id: review
        role: review
        provider: claude-opus
        mutates: false
        inputs: [plan.md, build.md]
        output: review.md
      - id: repair
        role: repair
        provider: claude
        mutates: true
        inputs: [plan.md, review.md]
        output: repair.md
      - id: verify
        role: verify
        provider: builtin
        mutates: false
        output: verify.txt
      - id: finish
        role: pr
        provider: claude-haiku
        mutates: true
        inputs: [plan.md, review.md, repair.md, verify.txt]
        output: finish.md

  tier1:
    description: Local builds, Claude judges and rescues. Opus plans, Sonnet reviews and repairs, the local coder does the token-heavy build.
    stages:
      - id: plan
        role: plan
        # Opus, not Sonnet: the weaker the builder, the more the plan has to
        # carry. A dense 27B follows a plan fairly literally and will not
        # recover from an ambiguous one, and plan is the cheapest stage to
        # spend a stronger model on — it reads little and runs once.
        provider: claude-opus
        mutates: false
        output: plan.md
      - id: build
        role: build
        provider: local-coder
        mutates: true
        inputs: [plan.md]
        output: build.md
      - id: review
        role: review
        provider: claude
        mutates: false
        inputs: [plan.md, build.md]
        output: review.md
      - id: repair
        role: repair
        provider: claude
        mutates: true
        inputs: [plan.md, review.md]
        output: repair.md
      - id: verify
        role: verify
        provider: builtin
        mutates: false
        output: verify.txt
      - id: finish
        role: pr
        provider: local-brain
        mutates: true
        inputs: [plan.md, review.md, repair.md, verify.txt]
        output: finish.md

  tier2:
    description: Mainly local. One Claude call, spent on review, where a miss is most expensive.
    stages:
      - id: plan
        role: plan
        provider: local-brain
        mutates: false
        output: plan.md
      - id: build
        role: build
        provider: local-coder
        mutates: true
        inputs: [plan.md]
        output: build.md
      - id: review
        role: review
        provider: claude
        mutates: false
        inputs: [plan.md, build.md]
        output: review.md
      - id: repair
        role: repair
        provider: local-coder
        mutates: true
        inputs: [plan.md, review.md]
        output: repair.md
      - id: verify
        role: verify
        provider: builtin
        mutates: false
        output: verify.txt
      - id: finish
        role: pr
        provider: local-brain
        mutates: true
        inputs: [plan.md, review.md, repair.md, verify.txt]
        output: finish.md

  tier3:
    description: All local. The brain plans and reviews, the coder builds and repairs; set RIS_LOCAL_LOOP_MODEL=qwen3-coder-next:q4_K_M for a large project.
    stages:
      - id: plan
        role: plan
        provider: local-brain
        mutates: false
        output: plan.md
      - id: build
        role: build
        provider: local-coder
        mutates: true
        inputs: [plan.md]
        output: build.md
      - id: review
        role: review
        provider: local-brain
        mutates: false
        inputs: [plan.md, build.md]
        output: review.md
      - id: repair
        role: repair
        provider: local-coder
        mutates: true
        inputs: [plan.md, review.md]
        output: repair.md
      - id: verify
        role: verify
        provider: builtin
        mutates: false
        output: verify.txt
      - id: finish
        role: pr
        provider: local-brain
        mutates: true
        inputs: [plan.md, review.md, repair.md, verify.txt]
        output: finish.md
